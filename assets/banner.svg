  <g class="fade2"><text x="600" y="168" text-anchor="middle" font-size="20" fill="#f9a8d4" letter-spacing="6">イスラム・クッティバエフ</text></g>
  <g class="fade3"><text x="600" y="210" text-anchor="middle" font-size="20" fill="#e2e8f0" letter-spacing="1.5">Data Scientist · ML Engineer · SDU University</text></g>

