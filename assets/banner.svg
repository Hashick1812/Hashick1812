  <circle cx="1030" cy="90" r="110" fill="url(#glow)"/>
  <mask id="cres"><rect width="1200" height="320" fill="#fff"/><circle cx="1052" cy="76" r="40" fill="#000"/></mask>
  <g class="moon"><circle cx="1030" cy="90" r="46" fill="#fde7f3" mask="url(#cres)"/></g>

