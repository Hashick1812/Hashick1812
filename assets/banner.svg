<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Islam Kuttybaev — Data Scientist and ML Engineer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1026"/>
      <stop offset="0.55" stop-color="#1b1640"/>
      <stop offset="1" stop-color="#3a1f4d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd6e8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd6e8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#f9a8d4"/>
    </linearGradient>
    <path id="petal" d="M0 0 C6 -8 16 -6 14 4 C12 12 3 14 0 8 C-3 14 -12 12 -14 4 C-16 -6 -6 -8 0 0Z" fill="#f9a8d4" opacity="0.85"/>
    <g id="blossom"><circle r="7" fill="#fbcfe8"/><circle r="3" fill="#f472b6"/></g>
  </defs>
  <style>
    .st { fill:#e2e8f0; animation: tw 3.5s ease-in-out infinite; }
    @keyframes tw { 0%,100% { opacity:.25 } 50% { opacity:1 } }
    .pw { animation-name: fall; animation-timing-function: linear; animation-iteration-count: infinite; }
    @keyframes fall {
      0%   { transform: translate(0,0) rotate(0deg); opacity:0 }
      8%   { opacity:1 }
      100% { transform: translate(var(--dx), 420px) rotate(320deg); opacity:.2 }
    }
    .fade { animation: in 1.6s ease-out both; }
    .fade2 { animation: in 1.6s ease-out .5s both; }
    .fade3 { animation: in 1.6s ease-out 1s both; }
    @keyframes in { from { opacity:0; transform: translateY(12px) } to { opacity:1; transform:none } }
    .moon { animation: pulse 6s ease-in-out infinite; transform-origin: 1030px 90px; }
    @keyframes pulse { 0%,100% { opacity:.8 } 50% { opacity:1 } }
    text { font-family: 'Segoe UI', 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', Helvetica, Arial, sans-serif; }
  </style>

