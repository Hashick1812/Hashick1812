    <use href="#blossom" x="40" y="46"/><use href="#blossom" x="85" y="40"/><use href="#blossom" x="150" y="56"/>
    <use href="#blossom" x="200" y="66"/><use href="#blossom" x="250" y="80"/><use href="#blossom" x="290" y="104"/>
