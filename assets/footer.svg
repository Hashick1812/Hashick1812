<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-label="ありがとう! Thanks for visiting">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a1f4d" stop-opacity="0"/><stop offset=".45" stop-color="#3a1f4d"/><stop offset="1" stop-color="#0b1026"/></linearGradient>
    <linearGradient id="t" x1="0" x2="1"><stop offset="0" stop-color="#7dd3fc"/><stop offset=".5" stop-color="#c4b5fd"/><stop offset="1" stop-color="#f9a8d4"/></linearGradient>
  </defs>
  <style>
    text{font-family:'Segoe UI','Hiragino Sans','Noto Sans JP',Helvetica,Arial,sans-serif}
    .w{animation:wave 6s ease-in-out infinite alternate}
    @keyframes wave{to{transform:translateX(-60px)}}
    .p{animation:pulse 3s ease-in-out infinite}
    @keyframes pulse{50%{opacity:.6}}
  </style>
  <path class="w" d="M-60 40 Q90 0 240 40 T540 40 T840 40 T1140 40 T1440 40 V140 H-60Z" fill="url(#g)"/>
  <text class="p" x="600" y="100" text-anchor="middle" font-size="28" font-weight="800" fill="url(#t)" letter-spacing="3">ありがとう! · Thanks for visiting</text>
</svg>
