<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-label="May the Force be with you">
  <style>
    text{font-family:'Franklin Gothic Medium','Arial Narrow',Arial,sans-serif}
    .p{animation:p 3s ease-in-out infinite}@keyframes p{50%{opacity:.55}}
    .tw{animation:tw 2.5s ease-in-out infinite}@keyframes tw{50%{opacity:.2}}
  </style>
  <rect width="1200" height="120" rx="12" fill="#000"/>
  <g fill="#fff"><circle class="tw" cx="80" cy="30" r="1.4"/><circle cx="210" cy="90" r="1"/><circle class="tw" cx="400" cy="20" r="1.2"/><circle cx="760" cy="95" r="1"/><circle class="tw" cx="980" cy="28" r="1.4"/><circle cx="1120" cy="80" r="1"/><circle cx="560" cy="100" r=".8"/><circle cx="300" cy="55" r=".8"/><circle cx="880" cy="60" r=".8"/></g>
  <text class="p" x="600" y="72" text-anchor="middle" font-size="34" font-weight="800" letter-spacing="6" fill="#ffe81f">MAY THE FORCE BE WITH YOU</text>
</svg>