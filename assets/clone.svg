<svg xmlns="http://www.w3.org/2000/svg" width="200" height="220" viewBox="0 0 200 220" role="img" aria-label="Animated clone trooper helmet (501st Legion)">
  <defs>
    <linearGradient id="armor" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cbd5e1"/></linearGradient>
    <clipPath id="visorClip"><path d="M50 96 L150 96 L146 118 L119 122 L113 160 L87 160 L81 122 L54 118Z"/></clipPath>
  </defs><style>
    .tilt{animation:tilt 5s ease-in-out infinite;transform-origin:100px 200px}
