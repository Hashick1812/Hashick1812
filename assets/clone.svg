    .glint{animation:glint 3.5s ease-in-out infinite}
    @keyframes glint{0%,60%{transform:skewX(-20deg) translateX(0)}90%,100%{transform:skewX(-20deg) translateX(200px)}}
    .hud{animation:hud 1.2s steps(1) infinite}@keyframes hud{50%{opacity:0}}
  </style>
  <g class="tilt">
    <path d="M40 112 C40 52 68 22 100 22 C132 22 160 52 160 112 L165 150 C165 170 152 182 141 187 L128 202 L72 202 L59 187 C48 182 35 170 35 150Z" fill="url(#armor)" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="93" y="23" width="14" height="72" rx="3" fill="#2563eb"/>
    <path d="M48 84 Q60 60 78 52 L80 60 Q64 68 56 88Z" fill="#2563eb"/>
    <path d="M152 84 Q140 60 122 52 L120 60 Q136 68 144 88Z" fill="#2563eb"/>
    <g clip-path="url(#visorClip)">
      <path d="M50 96 L150 96 L146 118 L119 122 L113 160 L87 160 L81 122 L54 118Z" fill="#0b1120"/>
      <rect class="glint" x="20" y="80" width="18" height="100" fill="#fff" opacity=".35" transform="skewX(-20)"/>
    </g>
    <path d="M60 99 L140 99" stroke="#38bdf8" stroke-width="1.5" opacity=".5"/>
    <path d="M66 172 Q100 160 134 172 L128 186 Q100 176 72 186Z" fill="#cbd5e1" stroke="#94a3b8"/>
    <g stroke="#475569" stroke-width="2.5" stroke-linecap="round"><path d="M88 178 L88 192"/><path d="M96 177 L96 194"/><path d="M104 177 L104 194"/><path d="M112 178 L112 192"/></g>
    <circle cx="40" cy="140" r="9" fill="#e2e8f0" stroke="#94a3b8"/><circle cx="160" cy="140" r="9" fill="#e2e8f0" stroke="#94a3b8"/>
    <rect x="152" y="104" width="4" height="34" rx="2" fill="#64748b"/>
    <circle class="hud" cx="137" cy="108" r="2.5" fill="#ef4444"/>
  </g>
</svg>