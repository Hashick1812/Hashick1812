<svg xmlns="http://www.w3.org/2000/svg" width="400" height="460" viewBox="0 0 400 460" role="img" aria-label="Cute chibi anime girl with cat ears coding on a laptop">
  <defs>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <linearGradient id="hairDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="0.55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9a8d4"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#f9a8d4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f9a8d4" stop-opacity="0"/>
    </radialGradient>
    <g id="eye">
      <ellipse cx="0" cy="0" rx="21" ry="27" fill="#fff"/>
      <ellipse cx="0" cy="3" rx="18" ry="24" fill="url(#iris)"/>
      <ellipse cx="0" cy="6" rx="9" ry="12" fill="#0f172a"/>
      <ellipse cx="-7" cy="-9" rx="7" ry="8" fill="#fff"/>
      <circle cx="7" cy="12" r="3.5" fill="#fff" opacity="0.9"/>
      <path d="M-22 -12 Q-14 -30 4 -28 Q18 -27 24 -16" stroke="#3b0764" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M21 -19 L28 -24" stroke="#3b0764" stroke-width="3.5" stroke-linecap="round"/>
    </g>
    <path id="heart" d="M0 4 C-6 -4 -14 2 -8 9 L0 16 L8 9 C14 2 6 -4 0 4Z"/>
    <path id="spark" d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2Z"/>
  </defs>

  <style>
    .bob   { animation: bob 3s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-6px); } }
    .blink { animation: blink 4.5s infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(0.08); } }
    .earL  { animation: twitchL 5s ease-in-out infinite; transform-origin: 128px 118px; }
    .earR  { animation: twitchR 5s ease-in-out infinite 0.4s; transform-origin: 272px 118px; }
    @keyframes twitchL { 0%, 85%, 100% { transform: rotate(0); } 90% { transform: rotate(-9deg); } }
    @keyframes twitchR { 0%, 85%, 100% { transform: rotate(0); } 90% { transform: rotate(9deg); } }
    .float { animation: float 4s ease-in-out infinite; }
    @keyframes float { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-70px); opacity: 0; } }
    .tw    { animation: tw 2.2s ease-in-out infinite; }
    @keyframes tw { 50% { opacity: 0.2; } }
    .code  { animation: type 2.4s steps(1) infinite; }
    @keyframes type { 50% { opacity: 0; } }
    .tail  { animation: tail 3s ease-in-out infinite; transform-origin: 262px 400px; }
    @keyframes tail { 50% { transform: rotate(12deg); } }
  </style>

  <circle cx="200" cy="230" r="190" fill="url(#aura)"/>

  <!-- sparkles and hearts -->
  <g fill="#fde68a" class="tw"><use href="#spark" x="60" y="80"/><use href="#spark" x="350" y="140"/></g>
  <g fill="#c4b5fd" class="tw" style="animation-delay:1.1s"><use href="#spark" x="330" y="60"/><use href="#spark" x="44" y="220"/></g>
  <g fill="#f472b6">
    <g class="float"><use href="#heart" x="330" y="260"/></g>
    <g class="float" style="animation-delay:1.3s"><use href="#heart" x="70" y="300"/></g>
    <g class="float" style="animation-delay:2.6s"><use href="#heart" x="300" y="200" transform="scale(0.8)" transform-origin="300 200"/></g>
  </g>

  <g class="bob">
    <!-- tail -->
    <path class="tail" d="M262 400 C320 400 340 350 318 320 C308 306 296 318 306 328 C318 345 300 380 262 385Z" fill="url(#hairDark)"/>

    <!-- back hair -->
    <path d="M86 190 C80 110 140 70 200 70 C260 70 320 110 314 190 L326 320 C300 330 280 318 272 300 L128 300 C120 318 100 330 74 320Z" fill="url(#hairDark)"/>

    <!-- body / hoodie -->
    <path d="M130 300 C130 280 160 272 200 272 C240 272 270 280 270 300 L282 410 C282 424 118 424 118 410Z" fill="url(#hoodie)"/>
    <path d="M178 276 L200 300 L222 276" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="190" cy="318" r="3" fill="#fff"/><circle cx="210" cy="318" r="3" fill="#fff"/>

    <!-- cat ears -->
    <g class="earL"><path d="M98 150 L112 64 L168 112Z" fill="url(#hair)"/><path d="M112 134 L118 86 L150 114Z" fill="#fbcfe8"/></g>
    <g class="earR"><path d="M302 150 L288 64 L232 112Z" fill="url(#hair)"/><path d="M288 134 L282 86 L250 114Z" fill="#fbcfe8"/></g>

    <!-- face -->
    <ellipse cx="200" cy="196" rx="98" ry="90" fill="#ffe8dc"/>

    <!-- bangs -->
    <path d="M100 176 C96 118 140 88 200 88 C260 88 304 118 300 176 C290 150 276 138 262 132 C266 150 262 160 256 168 C246 146 232 134 214 128 C216 146 210 156 202 162 C194 142 180 132 164 128 C166 146 156 158 146 164 C144 150 136 138 124 134 C114 146 106 160 100 176Z" fill="url(#hair)"/>
    <!-- side locks -->
    <path d="M102 170 C92 214 96 258 112 284 C118 250 116 214 120 184Z" fill="url(#hair)"/>
    <path d="M298 170 C308 214 304 258 288 284 C282 250 284 214 280 184Z" fill="url(#hair)"/>
    <!-- hair shine -->
    <path d="M150 104 C170 96 196 94 214 98" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.6"/>
    <!-- hair clip -->
    <g transform="translate(262 128) rotate(20)"><use href="#spark" fill="#fde68a" transform="scale(1.4)"/></g>

    <!-- eyes -->
    <g class="blink"><use href="#eye" x="158" y="204"/></g>
    <g class="blink"><use href="#eye" x="242" y="204"/></g>

    <!-- blush -->
    <ellipse cx="130" cy="240" rx="16" ry="8" fill="#f9a8d4" opacity="0.7"/>
    <ellipse cx="270" cy="240" rx="16" ry="8" fill="#f9a8d4" opacity="0.7"/>
    <g stroke="#f472b6" stroke-width="2" stroke-linecap="round" opacity="0.8">
      <path d="M122 236 L118 244"/><path d="M130 236 L126 244"/><path d="M138 236 L134 244"/>
      <path d="M266 236 L262 244"/><path d="M274 236 L270 244"/><path d="M282 236 L278 244"/>
    </g>

    <!-- cat mouth -->
    <path d="M188 246 Q194 254 200 246 Q206 254 212 246" stroke="#7c2d12" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- laptop -->
    <path d="M120 340 L280 340 L292 410 L108 410Z" fill="#e2e8f0"/>
    <rect x="128" y="346" width="144" height="58" rx="4" fill="url(#screen)"/>
    <text x="200" y="382" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="20" font-weight="700" fill="#7dd3fc">&lt;/&gt;<tspan class="code" fill="#f9a8d4">_</tspan></text>
    <rect x="96" y="408" width="208" height="12" rx="6" fill="#cbd5e1"/>
    <circle cx="200" cy="376" r="0" fill="none"/>

    <!-- paws on laptop -->
    <ellipse cx="132" cy="410" rx="20" ry="13" fill="#ffe8dc"/>
    <ellipse cx="268" cy="410" rx="20" ry="13" fill="#ffe8dc"/>
    <g fill="#f9a8d4"><circle cx="124" cy="407" r="3"/><circle cx="132" cy="404" r="3"/><circle cx="140" cy="407" r="3"/>
    <circle cx="260" cy="407" r="3"/><circle cx="268" cy="404" r="3"/><circle cx="276" cy="407" r="3"/></g>
  </g>
</svg>
